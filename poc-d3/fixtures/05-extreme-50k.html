<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shotly PoC S5b — Over the limit (50,001px)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #1f2328; background: #fff; }
  .banner { padding: 20px 28px; background: #7f1d1d; color: #fff; }
  .banner h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.02em; }
  .banner p { margin: 0; font-size: 14px; color: #fecaca; }
  .row { display: flex; gap: 20px; padding: 20px 28px; border-bottom: 1px solid #eaeef2; align-items: center; }
  .row .n { flex: 0 0 84px; font-size: 13px; color: #8b949e; }
  .row .t { flex: 1 1 auto; font-size: 16px; line-height: 1.5; }
  .row .b { flex: 0 0 120px; height: 64px; border-radius: 8px; }
  /* Same as the 49k fixture: the filler is striped, never blank — a blank
     tail is indistinguishable from a stitching gap. */
  .filler { margin: 0; background: repeating-linear-gradient(180deg, #e8ebee 0 20px, #f7f9fa 20px 40px); }
</style>
</head>
<body>

<div class="banner">
  <h1>Over the limit — 50,001px</h1>
  <p>One pixel past the hard limit. The extension must refuse before touching the capture API: no captureVisibleTab, no offscreen canvas, a readable message.</p>
</div>

<div id="rows"></div>
<div class="filler" id="filler"></div>

<script>
  (function () {
    const TARGET = 50001;
    const host = document.getElementById('rows');
    const filler = document.getElementById('filler');
    const PALETTE = ['#ef4444', '#f59e0b', '#db2777', '#0ea5e9', '#16a34a', '#7c3aed'];
    let seed = 50001;
    const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);

    for (let i = 0; i < 300; i++) {
      const row = document.createElement('div');
      row.className = 'row';
      const n = document.createElement('div');
      n.className = 'n';
      n.textContent = '#' + String(i + 1).padStart(3, '0');
      const t = document.createElement('div');
      t.className = 't';
      t.innerHTML =
        '<b>Section ' + (i + 1) + '</b> — content the tool must never even try to capture.';
      const b = document.createElement('div');
      b.className = 'b';
      b.style.background = PALETTE[i % PALETTE.length];
      row.appendChild(n);
      row.appendChild(t);
      row.appendChild(b);
      host.appendChild(row);
    }

    function fit() {
      filler.style.height = Math.max(0, TARGET - document.documentElement.scrollHeight) + 'px';
    }
    fit();
    window.addEventListener('load', fit);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  })();
</script>

</body>
</html>

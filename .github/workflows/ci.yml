name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Frozen lockfile — CI must fail if package.json and pnpm-lock.yaml drift.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # wxt prepare generates .wxt/ types + auto-imports. Without it the
      # type-check fails on defineBackground / defineContentScript globals.
      - name: Prepare WXT
        run: pnpm exec wxt prepare

      - name: Type-check
        run: pnpm compile

      # ⚠️ build 必须在 test 之前 ——
      #    守门测试（store-listing-consistency）要读 .output/chrome-mv3/ 的
      #    真实构建产物：查 manifest 权限、扫第三方网络请求。
      #    顺序反了这两条检查在 CI 里会静默跳过。
      - name: Build (chrome-mv3)
        run: pnpm build

      # ⚠️ build-pages 必须在 test **之前** ——
      #    站点守门测试（site-pages.test.ts）检查的是**生成出来的**
      #    dist-pages/，也就是真正发布到 GitHub Pages 的东西。
      #    不先构建，这条检查在 CI 里会直接报错（这是故意的：
      #    静默跳过比硬失败危险）。
      - name: Build pages (dist-pages)
        run: node tools/build-pages.mjs

      # 线上站点（GitHub Pages，gh-pages 分支）必须 = 仓库里生成的 dist-pages/。
      #
      # ## 为什么需要这条
      #
      # 站点是**手动** push 到 gh-pages 分支发布的，没有 deploy workflow。
      # 所以它会静默漂：改了 tools/build-pages.mjs，main 上是新的，
      # 但线上还是旧的 —— 而审核员点开的就是**线上那个**。
      #
      # 而且线上漂移的代价比仓库里漂移更大：
      # 线上首页吹了「re-download」但扩展还没这功能 = 审核员当场看到。
      #
      # 这条守门把「忘了发布」变成 CI 里的红灯。
      # ⚠️ 用 origin/gh-pages 而不是本地 gh-pages —— CI 里没有本地分支。
      - name: Verify published site matches repo (gh-pages)
        run: |
          # ⚠️ CI 是浅克隆，fetch 之后 gh-pages 在 FETCH_HEAD，
          #    **不是** origin/gh-pages（本地克隆才有后者）。两个都试。
          git fetch origin gh-pages --depth=1
          GH_REF=""
          for candidate in origin/gh-pages FETCH_HEAD; do
            if git rev-parse --verify --quiet "$candidate" >/dev/null; then
              GH_REF="$candidate"
              break
            fi
          done
          if [ -z "$GH_REF" ]; then
            echo "✗ 取不到 gh-pages 分支（origin/gh-pages 和 FETCH_HEAD 都不存在）"
            exit 1
          fi
          echo "用 $GH_REF 作为线上站点的来源"
          # ⚠️ 必须先 worktree remove + prune，再 rm -rf。
          #    直接 rm -rf 目录会留下 .git/worktrees 里的登记，
          #    下次 `git worktree add` 会报「missing but already registered」
          #    —— 脚本只能跑一次，第二次就挂。
          git worktree remove --force /tmp/gh-pages 2>/dev/null || true
          git worktree prune
          rm -rf /tmp/gh-pages
          git worktree add --detach /tmp/gh-pages "$GH_REF"
          echo "--- 差异（应为空）---"
          if ! diff -ru /tmp/gh-pages dist-pages --exclude='.git'; then
            echo ""
            echo "✗ 线上站点和仓库里的 dist-pages/ 不一致。"
            echo "  改动站点后要重新发布："
            echo "    node tools/build-pages.mjs"
            echo "    rm -rf /tmp/gh-pages"
            echo "    git worktree add --detach /tmp/gh-pages gh-pages"
            echo "    cp -R dist-pages/. /tmp/gh-pages/"
            echo "    cd /tmp/gh-pages && git add -A && git commit -m 'docs: 更新公开站点' && git push origin gh-pages"
            exit 1
          fi
          echo "✓ 线上站点与仓库一致"

      - name: Unit tests
        run: pnpm test

      # 提审文档里的测试数量不许漂。
      # 这些数字是审核被质疑「功能不足」时要贴出来的证据，而手抄的数字
      # 每次加测试就会过期（实测漂过：196→208→222）。
      # 数字从 runner 自己数（vitest list / playwright --list），不是数源码。
      # ⚠️ CI 里没有 test-infra/ 目录（E2E 在另一个仓库），所以 E2E 数
      #    在这里数不到 —— 脚本会明确说出来，不假装数到了。
      - name: Verify store doc numbers are current
        run: node tools/sync-store-counts.mjs --check

      # ⚠️ 这只是**编译检查**，不是受支持的平台。
      #    捕获链路依赖 `chrome.offscreen`（OffscreenCanvas 拼接），
      #    Firefox 没实现这个 API（MDN browser-compat-data 里没有 offscreen 条目），
      #    所以 firefox 产物运行时是坏的：chrome.offscreen 是 undefined，
      #    ensureOffscreen() 抛错，每次截图都失败。
      #    保留它是为了捕捉共享代码里误用 Chrome-only API 的情况。
      #    见 README 顶部 ⚠️ 和 progress.md 决策 #1（平台范围 = Chrome only）。
      - name: Build (firefox-mv2) — compile check only
        run: pnpm build:firefox

      # 提交给 CWS 的是 zip，不是 .output/chrome-mv3/。打包步骤本身是个
      # 黑盒（locale 目录可能漏打、manifest 可能被改写），所以在 CI 里
      # 把 zip 也跑一遍冒烟。
      - name: Package (zip)
        run: pnpm zip

      # ⚠️ 打包产物的冒烟测试需要 Playwright + 真实 Chrome，而且用的是
      #    headful（Playwright 自带 Chromium）——CI 里跑不了 headful。
      #    所以这里只做**静态**校验：zip 能解开、关键文件都在、manifest
      #    与 unpacked 构建一致。真实浏览器跑 zip 的那条测试在本地跑
      #    （test-infra/e2e/playwright-packaged-zip.spec.ts），
      #    CI 里用下面的 zip 完整性检查做兜底。
      - name: Verify packaged zip (static)
        run: |
          set -euo pipefail
          ZIP=$(ls .output/shotly-*.zip | head -1)
          echo "→ $ZIP"
          rm -rf /tmp/zcheck && mkdir -p /tmp/zcheck
          unzip -q "$ZIP" -d /tmp/zcheck
          for f in manifest.json popup.html offscreen.html background.js \
                   _locales/en/messages.json _locales/zh_CN/messages.json; do
            if [ ! -f "/tmp/zcheck/$f" ]; then
              echo "✗ zip 里缺 $f" >&2
              exit 1
            fi
            echo "✓ $f"
          done
          # manifest 不能在打包时被改写
          diff <(cat .output/chrome-mv3/manifest.json) <(cat /tmp/zcheck/manifest.json)
          echo "✓ manifest 一致"
          # zip 里不能有多余文件（比如本地开发残留）
          EXTRA=$(cd /tmp/zcheck && find . -type f | wc -l)
          echo "✓ zip 共 $EXTRA 个文件"

      - name: Upload chrome-mv3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: shotly-chrome-mv3
          path: .output/chrome-mv3
          retention-days: 14
          # ⚠️ include-hidden-files 必须开：`.output/` 以点开头，
          #    v4.4+ 默认 false 会把整个目录当隐藏文件跳过 → 静默上传 0 个文件。
          #    if-no-files-found 必须是 error —— 用 warn 的话上传失败
          #    整个 CI 依然是绿的，而 artifact 根本不存在（踩过）。
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload packaged zip (提交给 CWS 的就是这个)
        uses: actions/upload-artifact@v4
        with:
          name: shotly-chrome-zip
          path: .output/shotly-*.zip
          retention-days: 14
          # 同上：`.output/` 是隐藏目录，不开这个开关会静默上传 0 个文件。
          include-hidden-files: true
          if-no-files-found: error

name: E2E

# ⚠️ 为什么单独一个 workflow，而不是塞进 ci.yml：
#
#    这套 E2E 以前住在 workspace 仓库的 test-infra/ 里，
#    **CI 从来没跑过它** —— 29 个用例（含隐私「零第三方网络请求」守门、
#    打包 zip 守门、商店素材守门）全靠人工本地跑。
#
#    守门不在 CI 里跑 = 守门不存在。它保护的是商店 listing 的合规承诺
#    （不上传、不追踪）和要提交给 CWS 的实际产物 —— 这两样 CWS 审核员
#    能直接看，值得让 CI 每次 push 都验一遍。
#
#    单独一个 workflow 的原因：E2E 要装 Chromium（~150MB）+ 真跑浏览器，
#    比单元测试慢一个数量级。拆开才能让 ci.yml 快速反馈，
#    也才能给 E2E 单独设 timeout 和失败策略。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (真实 Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # wxt prepare 生成 .wxt/ 类型 —— 少了它 type-check 挂，
      # 而且 E2E 也要 build 产物。
      - name: Prepare WXT
        run: pnpm exec wxt prepare

      # Playwright 的 bundled Chromium。MV3 扩展必须用 bundled Chromium：
      # Chrome stable 会拒绝 --load-extension / --disable-extensions-except
      # （见 playwright.config.ts 的注释）。
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # ⚠️ build 必须先做完 ——
      #    几乎每个 E2E 都从 .output/chrome-mv3/ 装扩展。
      #
      #    「没 build / build 旧了」现在**硬失败**：
      #    spec 里的 `assertBuildIsFresh` 会比对产物 mtime 和源码 mtime，
      #    发现产物比源码旧就直接报错 —— 不再是静默 skip。
      #    （静默 skip = CI 绿着通过而什么都没测，是最危险的假绿。）
      #
      #    剩下的 `test.skip`（zip 缺失、扩展没加载成功等）由下面的
      #    「skipped 必须为 0」检查堵住。
      - name: Build (chrome-mv3)
        run: pnpm build

      # 打包产物也要（packaged-zip spec 测的是要提交给 CWS 的那个 zip）
      - name: Package (zip)
        run: pnpm zip

      # 商店素材 spec 需要 4 张截图 + 一份 meta；缺了会 skip。
      # 让它跑，并要求它真的产出（spec 内部有断言）。
      #
      # 用 json reporter 而不是 github reporter —— 因为下面要拿它来
      # 数「到底有多少用例被跳过了」（github reporter 的输出不好解析）。
      #
      # ⚠️ 必须限定 `--project=chromium` ——
      #    不限定的话会连 `real-sites` project 一起跑，而那个 project
      #    的用例在「站点不可达」时会**主动 skip**（那是网络问题，不是产品问题）。
      #    本 workflow 的门禁是「skipped 必须为 0」，
      #    于是「今天 Wikipedia 打不开」就会把**主门禁**拉红 ——
      #    门禁一旦被无关因素污染，就再也不会被认真看了。
      #    真实站点归 real-sites.yml 管（不阻塞，但结论可见）。
      - name: Run E2E
        run: pnpm exec playwright test --project=chromium --reporter=json > e2e-results.json || true

      # ⚠️ 假绿防线：E2E 全绿但一个都没跑，是最坏的情况。
      #
      #    spec 里的 test.skip 是**静默**的 —— 条件不满足时测试标记为
      #    skipped，exit code 还是 0。「全绿但全跳过」和「全绿且真跑过」
      #    在 exit code 上完全没区别。
      #
      #    （「没 build / build 旧了」已经改成硬失败了，见上面；
      #    这里守的是剩下的那几条：zip 缺失、扩展没加载成功等。）
      #
      #    所以这里不用 exit code 判断，而是解析 json reporter 的统计：
      #    有任何用例被跳过 = 失败。CI 里不该有「可跳过的用例」——
      #    真要跳，说明构建或环境有问题，应该被看见。
      #
      # ⚠️ 另一个洞（必须一起堵）：
      #    上面跑 Playwright 时用了 `|| true`（不然失败时拿不到 json）。
      #    于是**真实失败**也会被吞掉 —— 如果这里只看 expected/skipped，
      #    一个红了的 E2E 一样能让 CI 变绿。
      #    所以必须同时检查 stats.unexpected（失败数）。
      - name: Verify E2E actually ran (no silent skips, no swallowed failures)
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('fs');
          const path = 'e2e-results.json';
          if (!fs.existsSync(path)) {
            console.error('❌ 没有 E2E 结果文件 —— Playwright 根本没跑起来');
            process.exit(1);
          }
          let report;
          try {
            report = JSON.parse(fs.readFileSync(path, 'utf8'));
          } catch (e) {
            console.error('❌ E2E 结果不是合法 JSON：', e.message);
            process.exit(1);
          }
          const stats = report.stats ?? {};
          const expected = stats.expected ?? 0;
          const skipped = stats.skipped ?? 0;
          const flaky = stats.flaky ?? 0;
          const unexpected = stats.unexpected ?? 0;
          console.log(
            `E2E 统计：预期 ${expected}，失败 ${unexpected}，跳过 ${skipped}，不稳定 ${flaky}`,
          );

          /** 把指定状态的用例列出来，方便在 CI 日志里直接看。 */
          /**
           * 列出指定状态的用例。
           *
           * ⚠️ 必须**递归**遍历：Playwright 的 json reporter 里，
           *    `describe` 是**嵌套**的 —— 一个 suite 的子 suite 藏在
           *    `suite.suites[]` 里，spec 在更里面一层。
           *
           *    之前只遍历 `suites[].specs[]`（不递归），结果：
           *    所有 spec 都在 describe 块里 → 一条都列不出来 →
           *    CI 日志只显示「❌ 有 8 个 E2E 用例失败」然后一片空白，
           *    根本不知道是哪 8 个。
           *
           *    诊断信息为空，等于没有诊断信息。
           */
          function listTests(status) {
            const out = [];
            const walk = (suites, prefix) => {
              for (const suite of suites ?? []) {
                const title = [prefix, suite.title].filter(Boolean).join(' › ');
                for (const spec of suite.specs ?? []) {
                  for (const t of spec.tests ?? []) {
                    if (t.status === status) {
                      let msg = '';
                      for (const r of t.results ?? []) {
                        if (r.errors?.[0]?.message) { msg = r.errors[0].message.split('\n')[0]; break; }
                      }
                      out.push(`   [${status}] ${title} › ${spec.title}${msg ? ' — ' + msg : ''}`);
                    }
                  }
                }
                walk(suite.suites, title);
              }
            };
            walk(report.suites, '');
            return out;
          }

          let failed = false;

          // ⚠️ 真实失败不能被 `|| true` 吞掉。
          if (unexpected > 0) {
            console.error(`❌ 有 ${unexpected} 个 E2E 用例失败`);
            console.error(listTests('unexpected').join('\n'));
            failed = true;
          }
          if (expected === 0) {
            console.error('❌ 一个用例都没跑 —— 全部被跳过了');
            failed = true;
          }
          if (skipped > 0) {
            console.error(`❌ 有 ${skipped} 个用例被静默跳过 —— 守门没在测东西`);
            console.error(listTests('skipped').join('\n'));
            failed = true;
          }
          if (flaky > 0) {
            console.error(`❌ 有 ${flaky} 个用例不稳定（重跑才过）—— 不能算通过`);
            console.error(listTests('flaky').join('\n'));
            failed = true;
          }
          if (failed) process.exit(1);
          console.log(`✓ ${expected} 个 E2E 用例全部真跑过，没有静默跳过，也没有失败`);
          EOF

      # 失败时把 trace / video / 截图留下来（CI artifact）。
      # 光有「测试失败」没有现场，排查要重跑一遍，太慢。
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

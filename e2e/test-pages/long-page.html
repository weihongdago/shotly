<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shotly E2E — long scroll page</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
  /* Force ~5 viewport heights of content so the stitch pipeline runs ≥2 chunks. */
  .block {
    height: 800px;
    padding: 24px 32px;
    color: white;
    font-size: 28px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 2px solid rgba(0, 0, 0, 0.25);
  }
  .b1 { background: #ff5e5e; }
  .b2 { background: #ffae00; }
  .b3 { background: #4caf50; }
  .b4 { background: #2196f3; }
  .b5 { background: #9c27b0; }
  .b6 { background: #00bcd4; }
</style>
</head>
<body>
  <div class="block b1">Section 1 — top of page (START)</div>
  <div class="block b2">Section 2</div>
  <div class="block b3">Section 3</div>
  <div class="block b4">Section 4 — middle</div>
  <div class="block b5">Section 5</div>
  <div class="block b6">Section 6 — bottom (END)</div>
</body>
</html>
